name: daycare_app
description: Daycare management system (mobile) — registration, children, billing.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  ethiopian_datetime: ^1.0.5
  uuid: ^4.4.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  pdf: ^3.11.1
  crypto: ^3.0.5
  sqflite: ^2.4.1
  path: ^1.9.0
  open_file: ^3.5.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
  assets:
    - assets/fonts/NotoSansEthiopic-Regular.ttf
